name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install flask flask-cors yfinance pandas numpy python-dotenv pytest
      - run: pytest -q tests/test_api.py
